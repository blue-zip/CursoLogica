<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilha</title>
</head>
<body>
    
    <script>
       class Pilha {
        constructor(tamanhoLimite){
            if (tamanhoLimite && tamanhoLimite <= 0) {
                throw new Error("limite não pode ser menor ou igual a zero")
            }
            this.pilha = []
            this.limite = tamanhoLimite || null
        }

        

        // adicionar elemento na pilha
        adicionar(novoElemento){
            if (this.limite !== null && this.tamanho === this.limite) {
                throw new Error("Tamanho da pilha atingido") // Stack overflow
            }
            this.pilha.push(novoElemento)
        }

        // remover elemento da pilha
        remover(){
            if(this.estaVazia()){
                throw new Error("A pilha está vazia")
            }
            return this.pilha.pop()
        }

        // verificar se a pilha está vazia
        estaVazia(){
            return this.pilha.length === 0
        }

        // espiar o elemento do topo da pilha
        espiar(){
            if(this.estaVazia()) {
                return null
            }
            return this.pilha[this.pilha.length - 1]
        }

        // limpar a pilha
        limpar(){
            this.pilha.length = 0
        }

        // obter o número de elementos da pilha
        get tamanho(){
            return this.pilha.length
        }

       }

       const minhaPilha = new Pilha(3)
       console.log(minhaPilha.estaVazia()) // true
       minhaPilha.adicionar(1)
       minhaPilha.adicionar(2)
       minhaPilha.adicionar(3)
       console.log(minhaPilha.estaVazia()) //false
       console.log(minhaPilha.espiar()) // 3

       try{
            minhaPilha.adicionar(4)
       } catch(e) {
            console.log(e)
            console.log(e.message)
       }
       minhaPilha.remover()
       minhaPilha.remover()
       console.log(minhaPilha.espiar()) // 1
       minhaPilha.remover()
       console.log(minhaPilha.espiar()) // null
       console.log(minhaPilha.estaVazia()) // true
       console.log(minhaPilha.tamanho) // 0
       minhaPilha.adicionar(4)
       console.log(minhaPilha.tamanho) // 1
       console.log(minhaPilha.estaVazia()) // false
       minhaPilha.limpar()
       console.log(minhaPilha.tamanho) // 0
       console.log(minhaPilha.estaVazia()) // true

    </script>

</body>
</html>
