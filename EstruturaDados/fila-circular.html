<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila Circular</title>
</head>
<body>
    <script>
        class FilaCircular {
            constructor() {
                this.filaCircular = []
                this.itemAtual = undefined
                this.limite = 5
            }

            adicionar(novoItem) {
                // itemAtual não esta no final o proximo item existe
                if(this.filaCircular[this.filaCircular.length] != undefined) {
                    this.filaCircular[this.itemAtual] = novoItem
                    for(let i = this.itemAtual; i < 5 ; i++) {
                        this.filaCircular[i] = undefined
                    }
                    this.itemAtual = this.filaCircular.length - 1
                }
                // filaCircular esta cheia e o itemAtual esta no final da fila 
                if(this.filaCircular.length == this.limite) {
                    this.filaCircular.shift()
                    console.log("teste 3")
                    this.filaCircular[3] = novoItem
                }
                
                if(this.filaCircular[0] != undefined && this.itemAtual < 4) {
                    this.itemAtual = this.filaCircular.length 
                    this.filaCircular[this.filaCircular.length] = novoItem
                    console.log("teste 2")
                }
                // filaCircular recem-criada
                if(this.filaCircular.length == 0) {
                    this.itemAtual = 0
                    this.filaCircular[0] = novoItem
                    console.log("teste 1")
                }
                
                
            }

            avancar() {
                // lista esta cheia
                if(this.itemAtual == this.limite) {
                    throw new Error("Limite da lista atingido")
                }
                // não existe um proximo item
                if(this.filaCircular[this.filaCircular.length] == undefined) {
                    throw new Error("Não existe um proximo item")
                }
                // se o proximo item existe
                this.itemAtual += 1
                
            }

            voltar() {
                // não existe um item anterior
                if(this.itemAtual - 1 == undefined) {
                    throw new Error("Não existe um item anterior")
                }
                // se o item anterior existe
                this.itemAtual -= 1
                
            }
        }

        const historicoNavegaçao = new FilaCircular
    </script>
</body>
</html>
