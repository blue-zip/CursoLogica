<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila Circular</title>
</head>
<body>
    <script>
        class FilaCircular {
            constructor() {
                this.filaCircular = []
                this.itemAtual = null
                this.limite = 5
            }

            adicionar(novoItem) {
                // filaCircular esta cheia e o itemAtual esta no final da fila 
                if(this.filaCircular.length == 5 && this.itemAtual == 4) {
                    
                    
                    this.filaCircular.shift()
                    console.log("teste 3")
                    this.filaCircular[4] = novoItem
                }

                // itemAtual não esta no final e não existe um proximo item
                if(this.filaCircular[0] != undefined && this.itemAtual < 4 && this.filaCircular[this.itemAtual + 1] == undefined) {
                    
                    
                    this.itemAtual = this.filaCircular.length 
                    this.filaCircular[this.filaCircular.length] = novoItem
                    console.log("teste 2")
                }

                // itemAtual não esta no final e o proximo item existe
                if(this.filaCircular[0] != undefined && this.itemAtual < 4 && this.filaCircular[this.itemAtual + 1] != undefined) {
                    
                    
                    console.log("teste 4")
                    this.filaCircular[this.itemAtual + 1] = novoItem
                    for(let i = this.itemAtual; i < 5 ; i++) {
                        this.filaCircular[i + 2] = undefined
                    }
                    this.itemAtual += 1
                    this.filaCircular.length = this.itemAtual + 1
                }

                // filaCircular recem-criada
                if(this.filaCircular.length == 0) {
                    if(typeof novoItem === "string" || novoItem instanceof String) {
                        if (novoItem === "") {
                            throw new Error("O historico não aceita items vazios")
                        } else {
                            this.itemAtual = 0
                            this.filaCircular[0] = novoItem
                            console.log("teste 1")
                        }
                    } else {
                        throw new Error("O historico aceita apenas texto")
                    }
                    
                }
                
                
            }

            avancar() {
                // não existe um proximo item
                if(this.filaCircular[this.filaCircular.length] == undefined) {
                    throw new Error("Não existe um proximo item")
                }

                // se o proximo item existe
                this.itemAtual += 1
                
            }

            voltar() {
                if(this.filaCircular.length == 0) { // lista recem-criada
                    throw new Error("A lista esta vazia")
                } else if(this.itemAtual < 1) { // o item atual e o primeiro
                    throw new Error("Não existe um item anterior")
                } else {
                    // item anterior existe
                    this.itemAtual -= 1
                }

                
                
            }
        }

        const historico = new FilaCircular
    </script>
</body>
</html>
