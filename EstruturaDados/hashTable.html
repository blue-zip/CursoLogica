<body>

    <h1>listas ligadas ou encadeada</h1>

    <script>
        class HashNode{
            constructor(key, value){
                this.key = key
                this.value = value
                this.next = null
            }
        }

        class LinkedList{
            #size
            constructor(){
                this.head = null
                this.tail = null
                this.#size = 0
            }

            append(key ,value){  // adiciona no final da lista

                //primeiro, vamos verificar se a chave já existe

                const newNode = new HashNode(key ,value)

                if(this.head === null){ // estou adicionando o primeiro elemento da lista
                    this.head = newNode
                    this.tail = newNode
                } else { // não é o primeiro elemento da lista
                    const last = this.tail
                    last.next = newNode
                    this.tail = newNode
                }
                this.#size++
            }

            getByKey(key){
                let current = this.head

                while(current){
                    if(current.key === key){
                        return current.value
                    }
                    current = current.next
                }
                return false
            }


            remove(key){ // remover pela chave
                let current = this.head
                let prev = null

                while (current){
                    if (current.key === key){
                        if(prev){
                            prev.next = current.next
                            current.next = null
                        } else {
                            this.head = current.next
                            current.next = null
                        }
                        this.#size--
                        return true
                    }
                    prev = current
                    current = current.next
                }
                return false
            }

            isEmpty(){
                return this.head === null
            }

            get size(){
                return this.#size
            }

            print(){
                let current = this.head
                let result = ""
                while (current) {
                    result += current.value + " --> "
                    current = current.next
                }
                console.log(result + " --- Size: " + this.#size)
            }
        }

    </script>
